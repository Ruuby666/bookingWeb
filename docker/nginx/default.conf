server {
    listen 80;
    server_name localhost;
    server_tokens off;
    root /var/www/html/public;
    index index.php index.html;
    client_max_body_size 50M;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\. {
        deny all;
    }

    # --- Security headers ---
    add_header X-Content-Type-Options    "nosniff"                    always;
    add_header X-Frame-Options           "SAMEORIGIN"                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection          "1; mode=block"              always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Permissive but explicit CSP — will be hardened once the remaining
    # inline scripts are removed.
    # For now it allows: self, known CDNs, inline (still necessary).
    # Built with `set` so the header is sent on a single line: a multi-line
    # quoted value puts raw newlines inside the HTTP header.
    set $csp "default-src 'self'; ";
    set $csp "${csp}script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com https://cdn.jsdelivr.net https://code.jquery.com https://cdnjs.cloudflare.com https://unpkg.com; ";
    set $csp "${csp}style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com https://use.fontawesome.com; ";
    set $csp "${csp}font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://use.fontawesome.com; ";
    set $csp "${csp}img-src 'self' data: blob: https://maps.googleapis.com https://maps.gstatic.com; ";
    set $csp "${csp}connect-src 'self' https://maps.googleapis.com; ";
    set $csp "${csp}frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';";
    add_header Content-Security-Policy $csp always;
}
